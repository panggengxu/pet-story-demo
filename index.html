<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PETS STORY (Pro Demo)</title>
<style>
:root{--bg:#f4f7fe;--card:#fff;--primary:#4318ff;--accent:#ffb800;--text:#2b3674;--muted:#a3aed0;--border:#e9edf7;--ok:#05cd99;--soft:#f8f9fc}
*{box-sizing:border-box;margin:0;padding:0;font-family:'Segoe UI',Tahoma,sans-serif}
body{background:var(--bg);color:var(--text);padding:16px}
.container{max-width:1100px;margin:0 auto}
header{display:flex;justify-content:space-between;align-items:center;background:var(--card);padding:14px 20px;border-radius:16px;margin-bottom:16px;box-shadow:0 4px 12px rgba(0,0,0,.03);flex-wrap:wrap;gap:10px}
.brand{font-weight:bold;color:var(--primary)}
.tabs{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px}
.tab-btn{background:var(--bg);border:none;padding:8px 14px;border-radius:10px;font-weight:600;cursor:pointer;color:var(--text);font-size:.85rem;white-space:nowrap}
.tab-btn[aria-selected=true]{background:var(--primary);color:#fff}
button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.section-view{display:none}.section-view.active{display:block}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media(max-width:768px){.grid-2{grid-template-columns:1fr}}
.card{background:var(--card);border-radius:16px;padding:18px;box-shadow:0 4px 12px rgba(0,0,0,.03);margin-bottom:16px}
.card-title{font-size:.75rem;color:var(--muted);font-weight:700;text-transform:uppercase;margin-bottom:4px}
.card-heading{font-size:1.1rem;margin-bottom:12px;display:flex;justify-content:space-between;align-items:center}
.stat-row{display:flex;gap:10px;margin-bottom:14px}.stat{background:var(--soft);padding:10px;border-radius:10px;flex:1}
.subject-item{display:flex;justify-content:space-between;align-items:center;padding:10px 14px;border:1px solid var(--border);border-radius:10px;margin-bottom:8px}
.subject-item.done{background:#e6faf5;border-color:var(--ok)}
.btn-action{background:var(--primary);color:#fff;border:none;padding:8px 12px;border-radius:8px;cursor:pointer;font-weight:600;font-size:.8rem}
.btn-action:disabled{background:var(--ok);cursor:default}
.btn-gold{background:var(--accent);color:#000}.btn-block{width:100%}
