<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>老师后台 · Pets Story</title>
<style>
:root{--bg:#f4f7fe;--primary:#4318ff;--accent:#ffb800;--text:#2b3674;--muted:#a3aed0;--border:#e9edf7;--soft:#f8f9fc;--ok:#05cd99}
*{box-sizing:border-box;margin:0;padding:0;font-family:'Segoe UI',Tahoma,sans-serif}
body{background:var(--bg);color:var(--text);padding:16px}
.wrap{max-width:1100px;margin:0 auto}
header{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;background:#fff;padding:14px 20px;border-radius:16px;margin-bottom:16px}
.brand{font-weight:bold;color:var(--primary)}
.card{background:#fff;border-radius:16px;padding:18px;margin-bottom:16px;box-shadow:0 4px 12px rgba(0,0,0,.03)}
h2{font-size:1.05rem;margin-bottom:12px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:end}
.row label{font-size:.75rem;font-weight:700;display:flex;flex-direction:column;gap:4px}
input{padding:8px 10px;border:1px solid var(--border);border-radius:8px;font-size:.9rem;width:140px}
select,textarea{padding:8px 10px;border:1px solid var(--border);border-radius:8px;font:inherit;font-size:.9rem}
textarea{width:100%;height:60px;resize:vertical;margin-top:8px}
select:focus,textarea:focus{outline:3px solid var(--accent);outline-offset:1px}
.chk{width:22px;height:22px;padding:0;cursor:pointer;accent-color:var(--ok)}
#roster td,#roster th,#topic-table td,#topic-table th{text-align:center}
#roster td:first-child,#roster th:first-child,#topic-table td:first-child,#topic-table th:first-child{text-align:left}
#roster th .b,#topic-table th .b{margin:4px 2px 0;padding:3px 8px;font-size:.7rem}
.b{background:var(--primary);color:#fff;border:none;padding:8px 12px;border-radius:8px;cursor:pointer;font-weight:600;font-size:.8rem}
.b.gold{background:var(--accent);color:#000}.b.ghost{background:var(--bg);color:var(--text)}.b.red{background:#fde8e8;color:#c22}
button:focus-visible,input:focus{outline:3px solid var(--accent);outline-offset:1px}
.scroll{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:.88rem;min-width:640px}
th,td{padding:10px 8px;border-bottom:1px solid var(--border);text-align:left;white-space:nowrap}
th{color:var(--muted);font-size:.75rem}
td.act{display:flex;gap:6px}
.empty{color:var(--muted);padding:12px 0}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--text);color:#fff;padding:10px 18px;border-radius:10px;font-size:.9rem;opacity:0;pointer-events:none;transition:opacity .2s;max-width:90vw}
#toast.show{opacity:1}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand">👩‍🏫 老师后台 · <span id="me"></span></div>
    <div class="row"><button class="b ghost" data-a="mypw">修改我的密码</button><button class="b" data-a="logout">退出</button></div>
  </header>

  <section class="card">
    <h2>📝 默写 / 功课名单</h2>
    <div class="row">
      <label>日期<input id="r-date" type="date"></label>
      <label>类型<select id="r-kind"><option>默写</option><option>功课</option></select></label>
      <button class="b ghost" data-a="copyTodo">复制未完成名单</button>
    </div>
    <div style="margin:8px 0;font-size:.82rem;color:var(--muted)">在补习中心默写或做完功课，老师直接勾选即可，打勾自动保存。表头的“全勾”可一次勾选/取消全班。</div>
    <div class="scroll"><table id="roster"></table></div>
    <div id="roster-sum" style="margin-top:12px;font-size:.88rem;line-height:1.8"></div>
  </section>

  <section class="card">
    <h2>📌 主题名单（作文、专题等）</h2>
    <div class="row">
      <label>类型<select id="t-kind"><option>功课</option><option>默写</option></select></label>
      <label>科目<select id="t-subj"></select></label>
      <label>主题名称<input id="t-title" maxlength="30" style="width:220px" placeholder="例如：我最敬爱的人"></label>
      <label>截止日期（选填）<input id="t-due" type="date"></label>
      <button class="b" data-a="addTopic">添加主题</button>
    </div>
    <div class="row" style="margin:12px 0 8px">
      <label>查看<select id="t-filter"><option value="">全部科目</option></select></label>
      <button class="b ghost" data-a="copyTopics">复制未完成名单</button>
    </div>
    <div style="margin-bottom:8px;font-size:.82rem;color:var(--muted)">主题不按日期计算，学生什么时候交都在同一格勾选。同一科目可以添加多个主题。</div>
    <div class="scroll"><table id="topic-table"></table></div>
    <div id="topic-sum" style="margin-top:12px;font-size:.88rem;line-height:1.8"></div>
  </section>

  <section class="card">
    <h2>🎁 全班奖励</h2>
    <div class="row">
      <label>金币<input id="a-coins" type="number" value="0" min="0"></label>
      <label>星星<input id="a-stars" type="number" value="0" min="0"></label>
      <button class="b gold" data-a="awardAll">发放给全班</button>
    </div>
  </section>

  <section class="card">
    <h2>📢 发布公告 / 任务</h2>
    <div class="row">
      <label>类型<select id="p-type"><option value="notice">公告</option><option value="homework">功课（可发奖励）</option><option value="task">任务（可发奖励）</option></select></label>
      <label>科目<select id="p-subj"><option value="">不限科目</option></select></label>
      <label>标题<input id="p-title" maxlength="40" style="width:220px"></label>
      <label>奖励金币（仅任务）<input id="p-coins" type="number" value="20" min="0"></label>
      <label>奖励星星（仅任务）<input id="p-stars" type="number" value="1" min="0"></label>
    </div>
    <textarea id="p-body" maxlength="200" aria-label="内容" placeholder="内容（可选）"></textarea>
    <label style="display:block;margin-top:8px;font-size:.85rem"><input id="p-proof" type="checkbox" checked style="width:auto"> 要求学生提交证明（照片或文字说明）</label>
    <div style="margin:8px 0 16px"><button class="b" data-a="publish">发布</button></div>
    <div id="notice-list"></div>
  </section>

  <section class="card">
    <h2>➕ 添加学生</h2>
    <div class="row">
      <label>学号（字母/数字）<input id="n-id" maxlength="20"></label>
      <label>姓名<input id="n-name" maxlength="12"></label>
      <label>初始密码<input id="n-pw" type="text" maxlength="30"></label>
      <button class="b" data-a="add">添加</button>
    </div>
  </section>

  <section class="card">
    <h2>📋 学生列表（<span id="count">0</span> 人）</h2>
    <div class="scroll"><table>
      <thead><tr><th>姓名 / 学号</th><th>宠物</th><th>金币</th><th>星星</th><th>今日打卡</th><th>操作</th></tr></thead>
      <tbody id="rows"></tbody>
    </table></div>
    <div id="empty" class="empty" hidden>还没有学生，请先在上方添加。</div>
  </section>
</div>
<div id="toast" role="status" aria-live="polite"></div>

<script src="shared.js"></script>
<script>
const me = Auth.guard('teacher');
if (!me) throw new Error('未登录');

const $ = id => document.getElementById(id);
const el = (t, p = {}, ...k) => { const n = Object.assign(document.createElement(t), p); n.append(...k); return n; };
let tt; const toast = m => { const t = $('toast'); t.textContent = m; t.classList.add('show'); clearTimeout(tt); tt = setTimeout(() => t.classList.remove('show'), 2200); };
const students = () => Auth.users().filter(u => u.role === 'student');
const today = () => new Date().toLocaleDateString('sv');
const PETS = ['未孵化 🥚', 'Lv.1', 'Lv.2', 'Lv.3 👑'];

// 在学生存档上加金币/星星（学生没有存档时，从初始值开始算）
function award(id, c, s) {
  const d = Auth.loadSave(id) || {};
  d.coins = Math.max(0, (d.coins ?? Auth.START.coins) + c);
  d.stars = Math.max(0, (d.stars ?? Auth.START.stars) + s);
  Auth.writeSave(id, d);
}
const askNum = msg => { const n = parseInt(prompt(msg), 10); return Number.isFinite(n) ? n : null; };
const btn = (text, a, id, cls = 'b') => { const b = el('button', { className: cls, textContent: text }); b.dataset.a = a; if (id) b.dataset.id = id; return b; };

// ===== 默写 / 功课名单 =====
const rState = () => ({ d: $('r-date').value || today(), k: $('r-kind').value });
const rKey = (d, k, s) => `${d}|${k}|${s}`;
function renderRoster() {
  const { d, k } = rState(), stu = students(), recs = Auth.records(), tb = $('roster');
  tb.replaceChildren();
  if (!stu.length) return tb.append(el('caption', { className: 'empty', textContent: '还没有学生，请先在下方添加。' }));
  tb.append(el('thead', {}, el('tr', {}, el('th', { textContent: '学生' }),
    ...Auth.SUBJECTS.map(s => el('th', {}, el('div', { textContent: s }), btn('全勾', 'allsubj', s, 'b ghost'))))));
  const body = el('tbody');
  stu.forEach(u => body.append(el('tr', {}, el('td', { textContent: u.name }), ...Auth.SUBJECTS.map(s => {
    const c = el('input', { type: 'checkbox', className: 'chk', checked: (recs[rKey(d, k, s)] || []).includes(u.id) });
    c.dataset.sid = u.id; c.dataset.subj = s; c.setAttribute('aria-label', `${u.name} ${s}${k}`);
    return el('td', {}, c);
  }))));
  tb.append(body); renderSum();
}
function renderSum() {
  const { d, k } = rState(), stu = students(), recs = Auth.records(), box = $('roster-sum');
  box.replaceChildren();
  Auth.SUBJECTS.forEach(s => {
    const done = recs[rKey(d, k, s)] || [], todo = stu.filter(u => !done.includes(u.id));
    box.append(el('div', {}, el('b', { textContent: `${s}${k}：` }), `已完成 ${stu.length - todo.length}/${stu.length}　`,
      el('span', { textContent: todo.length ? `未完成：${todo.map(u => u.name).join('、')}` : '✅ 全部完成', style: todo.length ? 'color:#c22' : 'color:var(--ok)' })));
  });
}

// ===== 主题名单 =====
const topicList = () => { const f = $('t-filter').value; return Auth.topics().filter(t => !f || t.subject === f); };
function renderTopics() {
  const stu = students(), list = topicList(), tb = $('topic-table');
  tb.replaceChildren(); $('topic-sum').replaceChildren();
  if (!list.length) return tb.append(el('caption', { className: 'empty', textContent: '还没有主题，请先在上方添加。' }));
  if (!stu.length) return tb.append(el('caption', { className: 'empty', textContent: '还没有学生，请先在下方添加。' }));
  tb.append(el('thead', {}, el('tr', {}, el('th', { textContent: '学生' }), ...list.map(t => el('th', {},
    el('div', { textContent: t.title, style: 'font-weight:700' }),
    el('div', { textContent: `${t.subject}·${t.kind}${t.due ? '·' + t.due.slice(5) + '截止' : ''}`, style: 'font-size:.7rem;color:var(--muted)' }),
    btn('全勾', 'allTopic', t.id, 'b ghost'), btn('删除', 'delTopic', t.id, 'b red'))))));
  const body = el('tbody');
  stu.forEach(u => body.append(el('tr', {}, el('td', { textContent: u.name }), ...list.map(t => {
    const c = el('input', { type: 'checkbox', className: 'chk', checked: t.done.includes(u.id) });
    c.dataset.tid = t.id; c.dataset.tsid = u.id; c.setAttribute('aria-label', `${u.name} ${t.title}`);
    return el('td', {}, c);
  }))));
  tb.append(body); renderTopicSum();
}
function renderTopicSum() {
  const stu = students(), box = $('topic-sum'); box.replaceChildren();
  topicList().forEach(t => {
    const todo = stu.filter(u => !t.done.includes(u.id)), late = todo.length && t.due && t.due < today();
    box.append(el('div', {}, el('b', { textContent: `${t.subject}「${t.title}」：` }), `已完成 ${stu.length - todo.length}/${stu.length}　`,
      el('span', { textContent: todo.length ? `未完成：${todo.map(u => u.name).join('、')}${late ? '　⚠️已过截止' : ''}` : '✅ 全部完成', style: todo.length ? 'color:#c22' : 'color:var(--ok)' })));
  });
}

function renderNotices() {
  const box = $('notice-list'); box.replaceChildren();
  const stu = students(), all = Auth.notices();
  if (!all.length) return box.append(el('div', { className: 'empty', textContent: '还没有发布过内容。' }));
  all.forEach(n => {
    const kids = [
      el('div', { style: 'display:flex;justify-content:space-between;gap:8px;align-items:center' },
        el('b', { textContent: `${Auth.KIND[n.type] || '🎯 任务'}${n.subject ? '｜' + n.subject : ''}：${n.title}` }), btn('删除', 'delnotice', n.id, 'b red')),
      el('div', { textContent: n.body || '（无内容）', style: 'margin:4px 0;color:var(--muted);font-size:.85rem' })
    ];
    if (n.type !== 'notice') {
      const st = id => Auth.sub(n, id)?.status;
      const count = k => stu.filter(u => st(u.id) === k).length, todo = stu.filter(u => !st(u.id) || st(u.id) === 'rejected');
      kids.push(el('div', { textContent: `奖励：${n.coins}🪙 ${n.stars}⭐　已完成 ${count('done')}　待批准 ${count('pending')}　已退回 ${count('rejected')}　${n.needProof ? '需证明' : '无需证明'}`, style: 'font-size:.85rem' }));
      kids.push(el('div', { textContent: `未提交（${todo.length}）：${todo.map(u => u.name).join('、') || '无'}`, style: 'font-size:.85rem;color:#c22;margin-top:2px' }));
      stu.filter(u => st(u.id) === 'pending').forEach(u => {
        const sb = Auth.sub(n, u.id), photo = sb.photo && Auth.getProof(n.id, u.id);
        const row = el('div', { style: 'border-top:1px dashed var(--border);margin-top:8px;padding-top:8px;font-size:.88rem' },
          el('div', { textContent: `${u.name} 已提交（${new Date(sb.time || Date.now()).toLocaleString('zh-CN')}）` }),
          el('div', { textContent: sb.note ? `说明：${sb.note}` : '（没有文字说明）', style: 'margin:2px 0;color:var(--muted)' }));
        if (photo) {
          const img = el('img', { src: photo, alt: `${u.name} 的证明照片`, style: 'max-width:140px;border-radius:8px;cursor:zoom-in;display:block;margin:4px 0' });
          img.onclick = () => { img.style.maxWidth = img.style.maxWidth === '100%' ? '140px' : '100%'; };   // 点击放大/缩小
          row.append(img);
        }
        row.append(el('div', { style: 'display:flex;gap:6px;margin-top:6px' },
          btn('批准并发奖', 'approve', `${n.id}|${u.id}`, 'b gold'), btn('退回', 'reject', `${n.id}|${u.id}`, 'b ghost')));
        kids.push(row);
      });
    }
    box.append(el('div', { style: 'border:1px solid var(--border);border-radius:10px;padding:10px;margin-bottom:8px' }, ...kids));
  });
}

function render() {
  renderNotices(); renderRoster(); renderTopics();
  const list = students(), body = $('rows'); body.replaceChildren();
  $('count').textContent = list.length; $('empty').hidden = list.length > 0;
  list.forEach(u => {
    const d = Auth.loadSave(u.id) || {};
    const done = d.date === today() ? (d.completed || []).length : 0;
    body.append(el('tr', {},
      el('td', { textContent: `${u.name}（${u.id}）` }),
      el('td', { textContent: PETS[d.petLevel || 0] || '-' }),
      el('td', { textContent: d.coins ?? Auth.START.coins }),
      el('td', { textContent: d.stars ?? Auth.START.stars }),
      el('td', { textContent: `${done} / 5` }),
      el('td', { className: 'act' },
        btn('+金币', 'coin', u.id, 'b gold'), btn('+星星', 'star', u.id, 'b gold'),
        btn('重置密码', 'reset', u.id, 'b ghost'), btn('删除', 'del', u.id, 'b red'))));
  });
}

const A = {
  logout: Auth.logout,
  coin(id) { const n = askNum('发放多少金币？（负数为扣除）'); if (n) { award(id, n, 0); render(); toast('已更新金币'); } },
  star(id) { const n = askNum('发放多少星星？（负数为扣除）'); if (n) { award(id, 0, n); render(); toast('已更新星星'); } },
  awardAll() {
    const c = parseInt($('a-coins').value, 10) || 0, s = parseInt($('a-stars').value, 10) || 0, list = students();
    if (!list.length || (!c && !s)) return toast('请先填写奖励数量');
    list.forEach(u => award(u.id, c, s)); render(); toast(`已发放给 ${list.length} 位学生`);
  },
  async add() {
    const id = $('n-id').value.trim(), name = $('n-name').value.trim(), pw = $('n-pw').value;
    if (!/^[A-Za-z0-9_-]{2,20}$/.test(id)) return toast('学号只能是 2-20 位字母、数字、- 或 _');
    if (!name) return toast('请填写姓名');
    if (pw.length < 4) return toast('密码至少 4 位');
    const all = Auth.users();
    if (all.some(u => u.id === id)) return toast('这个学号已存在');
    all.push({ id, name, role: 'student', pw: await Auth.hash(id, pw) });
    Auth.saveUsers(all); ['n-id', 'n-name', 'n-pw'].forEach(i => $(i).value = ''); render(); toast(`已添加 ${name}`);
  },
  async reset(id) {
    const pw = prompt('输入新密码（至少 4 位）');
    if (pw === null) return;
    if (pw.length < 4) return toast('密码至少 4 位');
    const all = Auth.users(), u = all.find(x => x.id === id);
    u.pw = await Auth.hash(id, pw); Auth.saveUsers(all); toast('密码已重置');
  },
  del(id) {
    const u = Auth.users().find(x => x.id === id);
    if (!confirm(`确定删除 ${u.name}（${id}）？该学生的所有游戏数据也会被删除，无法恢复。`)) return;
    Auth.saveUsers(Auth.users().filter(x => x.id !== id)); localStorage.removeItem(Auth.saveKey(id)); render(); toast('已删除');
  },
  publish() {
    const type = $('p-type').value, task = type !== 'notice', title = $('p-title').value.trim();
    if (!title) return toast('请填写标题');
    const n = Auth.notices();
    n.unshift({ id: 'n' + Date.now(), type, subject: $('p-subj').value, needProof: task && $('p-proof').checked, title, body: $('p-body').value.trim(),
      coins: task ? Math.max(0, parseInt($('p-coins').value, 10) || 0) : 0,
      stars: task ? Math.max(0, parseInt($('p-stars').value, 10) || 0) : 0, date: today(), subs: {} });
    Auth.saveNotices(n); ['p-title', 'p-body'].forEach(i => $(i).value = ''); render(); toast('已发布');
  },
  delnotice(id) {
    if (!confirm('确定删除这一条？')) return;
    const n = Auth.notices().find(x => x.id === id);
    if (n) Object.keys(n.subs).forEach(sid => Auth.delProof(id, sid));
    Auth.saveNotices(Auth.notices().filter(x => x.id !== id)); render();
  },
  approve(id) {                                            // id = 公告id|学号
    const [nid, sid] = id.split('|'), all = Auth.notices(), n = all.find(x => x.id === nid);
    if (!n || Auth.sub(n, sid)?.status !== 'pending') return;
    n.subs[sid] = { ...Auth.sub(n, sid), status: 'done' }; Auth.saveNotices(all); award(sid, n.coins, n.stars); render(); toast('已批准并发放奖励');
  },
  addTopic() {
    const title = $('t-title').value.trim();
    if (!title) return toast('请填写主题名称');
    const all = Auth.topics();
    all.push({ id: 't' + Date.now(), kind: $('t-kind').value, subject: $('t-subj').value, title, due: $('t-due').value, done: [] });
    Auth.saveTopics(all); $('t-title').value = ''; $('t-due').value = ''; renderTopics(); toast('已添加主题');
  },
  allTopic(id) {                                           // 该主题：全班一键勾选；已全勾则取消
    const all = Auth.topics(), t = all.find(x => x.id === id), ids = students().map(u => u.id);
    if (!t) return;
    t.done = ids.every(i => t.done.includes(i)) ? [] : ids; Auth.saveTopics(all); renderTopics();
  },
  delTopic(id) {
    const t = Auth.topics().find(x => x.id === id);
    if (!t || !confirm(`确定删除主题「${t.title}」？勾选记录也会一起删除。`)) return;
    Auth.saveTopics(Auth.topics().filter(x => x.id !== id)); renderTopics();
  },
  copyTopics() {
    const stu = students();
    const lines = topicList().map(t => {
      const todo = stu.filter(u => !t.done.includes(u.id));
      return todo.length ? `${t.subject}「${t.title}」未完成：${todo.map(u => u.name).join('、')}` : null;
    }).filter(Boolean);
    navigator.clipboard?.writeText(lines.join('\n') || '所有主题都已完成 ✅')
      .then(() => toast('已复制未完成名单'), () => toast('复制失败，请手动选取页面上的文字'));
  },
  allsubj(s) {                                             // 该科目：全班一键勾选；已全勾则取消
    const { d, k } = rState(), all = Auth.records(), key = rKey(d, k, s), ids = students().map(u => u.id);
    all[key] = ids.every(id => (all[key] || []).includes(id)) ? [] : ids;
    Auth.saveRecords(all); renderRoster();
  },
  copyTodo() {                                             // 复制成文字，方便发给家长或同事
    const { d, k } = rState(), recs = Auth.records(), stu = students();
    const lines = Auth.SUBJECTS.map(s => {
      const done = recs[rKey(d, k, s)] || [], todo = stu.filter(u => !done.includes(u.id));
      return todo.length ? `${s}${k}未完成：${todo.map(u => u.name).join('、')}` : null;
    }).filter(Boolean);
    const text = `${d} ${k}名单\n` + (lines.join('\n') || '全部完成 ✅');
    navigator.clipboard?.writeText(text).then(() => toast('已复制未完成名单'), () => toast('复制失败，请手动选取页面上的文字'));
  },
  reject(id) {
    const [nid, sid] = id.split('|'), all = Auth.notices(), n = all.find(x => x.id === nid);
    if (!n || Auth.sub(n, sid)?.status !== 'pending') return;
    const reply = prompt('退回原因（学生会看到）', '请补充清楚一点再提交');
    if (reply === null) return;
    n.subs[sid] = { ...Auth.sub(n, sid), status: 'rejected', reply: reply.trim() };
    Auth.saveNotices(all); render(); toast('已退回，学生可以重新提交');
  },
  async mypw() {
    const pw = prompt('输入新的老师密码（至少 6 位）');
    if (pw === null) return;
    if (pw.length < 6) return toast('老师密码至少 6 位');
    const all = Auth.users(), u = all.find(x => x.id === me.id);
    u.pw = await Auth.hash(u.id, pw); Auth.saveUsers(all); toast('密码已修改');
  }
};

document.addEventListener('click', e => {
  const t = e.target.closest('[data-a]');
  if (t) A[t.dataset.a]?.(t.dataset.id);
});
window.addEventListener('storage', render);               // 学生在别的标签页打卡时，这里自动刷新

$('me').textContent = me.name;
$('r-date').value = today(); $('r-date').onchange = $('r-kind').onchange = renderRoster;
Auth.SUBJECTS.forEach(x => { $('t-subj').append(new Option(x, x)); $('t-filter').append(new Option(x, x)); });
$('t-filter').onchange = renderTopics;
document.addEventListener('change', e => {                 // 主题名单：勾选自动保存
  const c = e.target.closest('[data-tid]');
  if (!c) return;
  const all = Auth.topics(), t = all.find(x => x.id === c.dataset.tid);
  if (!t) return;
  const set = new Set(t.done); c.checked ? set.add(c.dataset.tsid) : set.delete(c.dataset.tsid);
  t.done = [...set]; Auth.saveTopics(all); renderTopicSum();
});
document.addEventListener('change', e => {                 // 勾选/取消勾选，自动保存
  const c = e.target.closest('[data-sid]');
  if (!c) return;
  const { d, k } = rState(), all = Auth.records(), key = rKey(d, k, c.dataset.subj), set = new Set(all[key] || []);
  c.checked ? set.add(c.dataset.sid) : set.delete(c.dataset.sid);
  all[key] = [...set]; Auth.saveRecords(all); renderSum();
});
Auth.SUBJECTS.forEach(x => $('p-subj').append(new Option(x, x)));
Auth.ready.then(render);
</script>
</body>
</html>
